# Baut den Model Domain Viewer (apps/domain-viewer) bei jedem Push auf main und veröffentlicht ihn auf GitHub Pages:
# https://bastian-schnitzler.github.io/graupel/ (REQ-822). Läuft nur in bastian-schnitzler/graupel.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bastian-schnitzler/graupel'
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm einrichten
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Viewer prüfen und bauen
        # Der Build nimmt die Daten aus model-data/ (scripts/prebuild.mjs) und schreibt apps/domain-viewer/dist.
        run: |
          pnpm --filter @graupel/domain-viewer test
          pnpm --filter @graupel/domain-viewer build

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/domain-viewer/dist

  deploy:
    needs: build
    if: github.repository == 'bastian-schnitzler/graupel'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
