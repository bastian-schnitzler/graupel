# Kuratierte Modell-Metadaten für den Katalog (graupel-gen catalog).
#
# Je Modell-ID:
#   name, provider, region, spatial_resolution_km, active
#                       kuratierte Katalogfelder; sie gehen den Werten des
#                       bestehenden Katalogs vor. Fehlt ein Modell hier, bleiben
#                       die Werte des Katalogs; ein neues Modell bekommt sie aus
#                       den Labels der Open-Meteo-Website und dem Namen.
#   meta_path           Pfad unter /data/{path}/static/meta.json, wenn er von
#                       der Modell-ID abweicht (Katalogfeld meta_path).
#                       Seamless-Blends und best_match haben keinen.
#   ensemble_meta_path  Ensemble hinter precipitation_probability
#                       (Katalogfeld ensemble_meta_path).
#   probe_point         [lat, lon] für die Katalog-Probe, innerhalb des
#                       Modellgebiets; ohne Angabe [50.0, 8.0].
#   documentation_url   Beschreibung des Modells beim Veröffentlicher (stabile
#                       Übersichtsseite), ersatzweise die Seite des Anbieters in
#                       der Open-Meteo-Dokumentation; Seamless-Blends und
#                       best_match zeigen auf die Open-Meteo-Dokumentation
#                       (Katalogfeld documentation_url, REQ-688). Geht dem
#                       bestehenden Katalog vor; ein neues Modell ohne Eintrag
#                       bekommt null.
#
# provider_prefixes: Anbieter neuer Modelle nach dem Präfix der ID.
# provider_urls: Haupt-Homepage je Anbieter (Katalogfeld provider_url). Jeder
#                     Anbieter in models und provider_prefixes braucht eine.
# excluded_models: Modelle der Open-Meteo-Enum, die nicht in den Katalog
#                     kommen (DEC-033: keine neuen Läufe mehr bei Open-Meteo).
# extra_models: Modelle, die die Forecast-API liefert, obwohl forecast.yml sie
#                     nicht nennt; sie zählen wie Modelle der Enum.
#
# Alle URLs müssen https mit Host sein; der Generator prüft nur die Form und
# ruft sie nicht ab (offline, DEC-030).

excluded_models:
  - bom_access_global
  - ncep_gfs_graphcast025
  - kma_seamless
  - kma_ldps
  - kma_gdps

# RRFS fehlt im OpenAPI-forecast.yml, die Forecast-API liefert es (REQ-768).
extra_models:
  - ncep_rrfs_conus

