[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graupel"
version = "0.1.0"
description = "Build customizable meteograms from Open-Meteo forecast data"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later AND MPL-2.0"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_LICENSES.md"]
dependencies = [
    "httpx>=0.28.1",
    "nest-asyncio>=1.6.0",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
    "pywebview>=6.2.1",
    "structlog>=26.1.0",
    "tzdata>=2024.1",
    "typer>=0.27.2",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]


[project.urls]
Homepage = "https://github.com/bastian-schnitzler/graupel"
Repository = "https://github.com/bastian-schnitzler/graupel"
Issues = "https://github.com/bastian-schnitzler/graupel/issues"

[tool.black]
line-length = 79

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
]

[project.gui-scripts]
graupel = "graupel.__main__:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["graupel*"]
namespaces = true

[tool.setuptools.package-data]
graupel = [
    "react/*",
    "react/**/*",
    "models/*",
    "models/**/*",
    "icons/*",
]
